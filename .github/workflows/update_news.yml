name: Daily Shiga School News

on:
  schedule:
    # 毎朝 日本時間 6:30 (UTC 21:30) に自動実行
    - cron: '30 21 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 滋賀学校ニュース要約 & HTML生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_news.py

      - name: Pages アーティファクトの準備
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
